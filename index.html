<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Freddy Flames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: an upright 1983 cabinet — lit marquee, vertical raster monitor in a black bezel, control panel below */
:root{
  --cab:#170d12;
  --cab-edge:#2a1720;
  --bezel:#050407;
  --ember:#ffcf4a;
  --flame:#ff6a1a;
  --steel:#9aa1b5;
  --ink:#f4ead8;
  --btn-jump:#2f7de1;
  --btn-fire:#e2362a;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--cab); color:var(--ink); font-family:var(--pixel);
  padding-inline:16px; padding-block:12px; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; gap:12px;
  overflow-x:hidden; -webkit-user-select:none; user-select:none;
}
.marquee{
  font-size:clamp(12px,3.4vw,18px); letter-spacing:.12em; text-align:center;
  background:linear-gradient(180deg,#fff2a8 0%,var(--ember) 35%,var(--flame) 70%,#c21d12 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 6px rgba(255,106,26,.55));
  padding-top:4px;
}
.bezel{
  background:var(--bezel); padding:10px; border-radius:8px;
  box-shadow:0 0 0 3px var(--cab-edge), inset 0 0 24px #000, 0 10px 30px rgba(0,0,0,.6);
  width:min(100%, 600px, calc((100dvh - 150px) * 0.7778 + 20px));
  min-width:min(100%, 260px);
  box-sizing:border-box;
}
canvas{display:block; width:100%; height:auto; aspect-ratio:224/288; image-rendering:pixelated; image-rendering:crisp-edges; outline:none; touch-action:none}
canvas:focus-visible{box-shadow:0 0 0 2px var(--ember)}
.stage{display:flex; justify-content:center; width:100%}
.side{display:none}
*{-webkit-tap-highlight-color:transparent; -webkit-touch-callout:none}
.legend{font-size:10px; line-height:2.8; color:var(--steel); text-align:center; max-width:640px}
.k{display:inline-block; min-width:14px; padding:3px 6px; margin:0 2px; border:1px solid #4a3d52; border-bottom-width:3px; border-radius:4px; background:#241a28; color:var(--ember); line-height:1.4; text-align:center}
.dpad{position:relative; width:150px; height:150px; border-radius:50%; touch-action:none;
  background:radial-gradient(circle,#30263a 0 34%,#241b2b 35% 100%); box-shadow:inset 0 0 0 3px #4a3d52, 0 4px 0 rgba(0,0,0,.5)}
.arr{position:absolute; color:#6c6478; font-size:20px; line-height:1; pointer-events:none}
.arr.on{color:var(--ember); text-shadow:0 0 8px var(--flame)}
.au{top:10px; left:50%; transform:translateX(-50%)} .ad{bottom:10px; left:50%; transform:translateX(-50%)}
.al{left:12px; top:50%; transform:translateY(-50%)} .ar{right:12px; top:50%; transform:translateY(-50%)}
.knob{position:absolute; width:58px; height:58px; left:46px; top:46px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#ff7a68,#c0281c 70%); box-shadow:0 4px 0 rgba(0,0,0,.45); transition:transform .05s}
.hint{font-size:8px; color:var(--steel); text-align:center}
.btns{display:flex; align-items:flex-end; gap:12px}
.round{border:0; border-radius:50%; color:#fff; font-family:var(--pixel); font-size:9px; touch-action:none;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.35), 0 3px 0 rgba(0,0,0,.4)}
.round.j{width:68px; height:68px; margin-bottom:44px; background:var(--btn-jump)}
.round.f{width:86px; height:86px; background:var(--btn-fire)}
.start{background:#3a3040; color:var(--ember); border:0; border-radius:14px; font-family:var(--pixel); font-size:8px; padding:10px 14px; touch-action:none}
button:active,button.on{filter:brightness(1.4); transform:translateY(2px)}
button:focus-visible{outline:2px solid var(--ember)}
.credit{font-size:8px; color:var(--steel); text-align:center; line-height:1.9; opacity:.85}
@media (pointer:coarse){
  body{touch-action:none; padding-block:8px; gap:8px}
  .legend{display:none}
  .side{display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0}
  .stage{display:grid; grid-template-columns:1fr 1fr; grid-template-areas:"screen screen" "left right"; gap:12px 8px; max-width:520px; align-items:center}
  .bezel{grid-area:screen; justify-self:center; padding:6px; width:min(100%, calc((100dvh - 260px) * 0.7778 + 12px)); min-width:min(100%,220px)}
  .sl{grid-area:left} .sr{grid-area:right}
}
@media (pointer:coarse) and (orientation:landscape){
  .marquee,.credit{display:none}
  .stage{grid-template-columns:1fr auto 1fr; grid-template-areas:"left screen right"; max-width:none; height:calc(100dvh - 16px)}
  .bezel{width:calc((100dvh - 28px) * 0.7778 + 12px); min-width:0}
}
</style>
</head>
<body>

<div class="marquee">FREDDY FLAMES</div>
<main class="stage">
  <div class="side sl">
    <div class="dpad" id="dpad" role="group" aria-label="Joystick">
      <span class="arr au" data-dir="up">▲</span><span class="arr ad" data-dir="down">▼</span>
      <span class="arr al" data-dir="left">◀</span><span class="arr ar" data-dir="right">▶</span>
      <span class="knob"></span>
    </div>
    <div class="hint">SLIDE TO WALK &amp; CLIMB</div>
  </div>
  <div class="bezel"><canvas id="scr" width="224" height="288" tabindex="0" aria-label="Freddy Flames game screen"></canvas></div>
  <div class="side sr">
    <div class="btns">
      <button class="round j" data-k="jump">JUMP</button>
      <button class="round f" data-k="fire">SQUIRT</button>
    </div>
    <button class="start" data-k="start">START / PAUSE</button>
  </div>
</main>
<div class="legend">
  <span class="k">←</span><span class="k">→</span> WALK &nbsp;&nbsp; <span class="k">↑</span> JUMP (OR CLIMB AT A LADDER) &nbsp;&nbsp; <span class="k">↓</span> CLIMB DOWN<br>
  <span class="k">SPACE</span> SQUIRT &nbsp;&nbsp; <span class="k">P</span> PAUSE &nbsp;&nbsp; <span class="k">M</span> SOUND
</div>
<div class="credit">FREDDY FLAMES BY LEE FEULING<br>2026 VERSION CO-DEVELOPED BY DAVID FEULING<br>RECREATION OF ORIGINAL, CIRCA 1983</div>

<script>
(()=>{
const cv=document.getElementById('scr'), g=cv.getContext('2d');
const W=224,H=288;
g.imageSmoothingEnabled=false;
const touch=matchMedia('(pointer:coarse)').matches;

// ---------- world ----------
const FL=[252,196,140];              // feet line of each floor (ground, 2nd, 3rd)
const LEFT=18, RIGHT=206;
// ---------- houses: each level gets its own building, getting trickier as you go ----------
const THEMES=[
  {n:'THE COTTAGE',  wall:'#5c2a26',wd:'#4a201d',tex:'brick', room:'#241628',stripe:'#2b1b31',base:'#1d1121',roof:'#3a2032',roofL:'#4d2a40',beam:'#8a5a2b',carpet:'#b8432f',style:'gable'},
  {n:'THE TOWNHOUSE',wall:'#3e4a5c',wd:'#323c4c',tex:'brick', room:'#1a2232',stripe:'#202a3c',base:'#141a27',roof:'#262b36',roofL:'#363d4c',beam:'#6a5a4a',carpet:'#3a6a8a',style:'flat'},
  {n:'THE FARMHOUSE',wall:'#7a5530',wd:'#5e4024',tex:'siding',room:'#2a1c14',stripe:'#32221a',base:'#20150f',roof:'#5a2020',roofL:'#6e2a2a',beam:'#9a6a34',carpet:'#5a7a3a',style:'gable'},
  {n:'THE VICTORIAN',wall:'#3e5a4a',wd:'#304a3c',tex:'siding',room:'#2a1a26',stripe:'#341f2f',base:'#1f1320',roof:'#2a2a3e',roofL:'#3a3a52',beam:'#7a4a2a',carpet:'#8a2a4a',style:'mansard'},
  {n:'THE MANSION',  wall:'#6a6258',wd:'#57504a',tex:'stone', room:'#26202e',stripe:'#2e2738',base:'#1c1722',roof:'#2b2b3c',roofL:'#3b3b50',beam:'#5a4030',carpet:'#7a1e2a',style:'towers'},
];
function seeded(n){let v=(n>>>0)||1;return()=>{v^=v<<13;v>>>=0;v^=v>>>17;v^=v<<5;v>>>=0;return v/4294967296;};}
function makeDecor(r,lad){
  const d=[],kinds=['sofa','lamp','shelf','table','frame','clock','plant'];
  for(let f=0;f<3;f++){
    const n=2+Math.floor(r()*2);let tries=0,placed=0;
    while(placed<n&&tries++<80){
      const k=kinds[Math.floor(r()*kinds.length)],x=Math.round(26+r()*172);
      if(lad.some(l=>(l.a===f||l.b===f)&&Math.abs(l.x-x)<16))continue;
      if(d.some(o=>o.f===f&&Math.abs(o.x-x)<26))continue;
      if(x>90&&x<148&&k==='frame')continue;
      d.push({k,x,f});placed++;
    }
  }
  return d;
}
function makeHouse(lv){
  const th=THEMES[(lv-1)%THEMES.length];
  if(lv===1){
    const lad=[{x:30,a:0,b:1},{x:194,a:0,b:1},{x:76,a:1,b:2},{x:148,a:1,b:2}];
    return {th,lad,pipes:[{x:70,f:0},{x:150,f:0},{x:44,f:1},{x:112,f:1},{x:178,f:1},{x:56,f:2},{x:168,f:2}],holes:[],decor:makeDecor(seeded(7),lad)};
  }
  const r=seeded(lv*7919+13),c=Math.min(lv-1,10),lad=[];let tries;
  for(const gap of [0,1]){
    const n=r()<.45?3:2;tries=0;
    while(lad.filter(l=>l.a===gap).length<n&&tries++<300){
      const x=Math.round(26+r()*172);
      if(lad.some(l=>(l.a===gap&&Math.abs(l.x-x)<36)||Math.abs(l.x-x)<14))continue;
      lad.push({x,a:gap,b:gap+1});
    }
  }
  // burned-through floor holes: Freddy and the flames drop through them
  const holes=[],nh=c<2?0:Math.min(4,Math.floor(c/2)+(r()<.5?1:0));tries=0;
  while(holes.length<nh&&tries++<300){
    const f=r()<.5?1:2,w=14+Math.floor(r()*10),x1=Math.round(34+r()*(150-w)),x2=x1+w;
    if(lad.some(l=>(l.a===f||l.b===f)&&l.x>x1-14&&l.x<x2+14))continue;
    if(holes.some(h=>h.f===f&&x1<h.x2+24&&x2>h.x1-24))continue;
    holes.push({f,x1,x2});
  }
  // fewer leaky pipes (less water) in the later houses
  const np=Math.max(4,8-Math.floor(c/2)),pipes=[];tries=0;
  while(pipes.length<np&&tries++<400){
    const f=pipes.length<3?pipes.length:Math.floor(r()*3),x=Math.round(30+r()*164);
    if(lad.some(l=>Math.abs(l.x-x)<10))continue;
    if(holes.some(h=>h.f===f&&x>h.x1-6&&x<h.x2+6))continue;
    if(pipes.some(q=>q.f===f&&Math.abs(q.x-x)<26))continue;
    pipes.push({x,f});
  }
  return {th,lad,pipes,holes,decor:makeDecor(r,lad)};
}
let house,LADDERS,PIPES,HOLES;
function setHouse(lv){house=makeHouse(lv);LADDERS=house.lad;PIPES=house.pipes;HOLES=house.holes;}
const inHole=(f,x)=>f>0&&HOLES.some(h=>h.f===f&&x>h.x1+1&&x<h.x2-1);
setHouse(1);
const PAL=[
  // sp speed, gr grow seconds, tu turn rate, la ladder chance, da dash rate, ch chase rate, sk ember seconds
  {n:'RED',   o:'#d8321e',m:'#ff8a1c',c:'#ffe27a',sp:16,gr:5.4,tu:.42,la:.38,da:.08,ch:.15,sk:7.5,desc:'THEY THROW SPARKS'},
  {n:'BLUE',  o:'#2348e8',m:'#4fb2ff',c:'#dff6ff',sp:23,gr:4.9,tu:.55,la:.48,da:.12,ch:.22,sk:6.5,desc:'THEY RUN FASTER'},
  {n:'GREEN', o:'#178a34',m:'#6fdc3e',c:'#efffb8',sp:19,gr:6.0,tu:1.7,la:.45,da:.2, ch:.2, sk:9.0,desc:'THEY ZIG AND ZAG'},
  {n:'VIOLET',o:'#8a22c9',m:'#ff58cf',c:'#ffe0f7',sp:28,gr:4.0,tu:.8, la:.65,da:.22,ch:.4, sk:5.0,desc:'THEY HUNT YOU DOWN'},
];
const PUDW=[0,7,13,21];
const TANKMAX=16;                    // 8 pressure levels x 2 shots
const MAXF=17;
const STARS=Array.from({length:40},()=>({x:Math.random()*W|0,y:24+Math.random()*70|0,p:Math.random()*6}));

// ---------- state ----------
let st='attract', stT=0, atPage=0, clock=0, paused=false;
let score=0, lives=3, level=1, extraGiven=false, demoLevel=1;
let fred, flames=[], drips=[], puds=[], streams=[], parts=[], pops=[], pipeT=[];
let bonusT=0, bonusScore=0, tankBonus=0, entry=null, embers=[], burnT=0, burned=false;
// bonus rounds: 0 PIPE BURST, 1 PET RESCUE, 2 HOT SPOTS (rotate; each lap gets tighter)
let bType=0, bTier=0, combo=0, bWait=0, bLast=-1, bPerfect=false, pets=[], targets=[];
const BONUS=[
  {n:'PIPE BURST', a:'PIPES BURST ONE BY ONE',b:'GRAB EACH PUDDLE FAST'},
  {n:'PET RESCUE', a:'THE PETS ARE TRAPPED!', b:'SAVE THEM ALL IN TIME'},
  {n:'HOT SPOTS',  a:'SPOT FIRES POP UP',     b:'SQUIRT THEM QUICK'},
];
// Global leaderboard: a shared JSON bin, list of [initials, score], best first.
const LB_URL='https://json.extendsclass.com/bin/15c396252bb6';
const LB_SIZE=10;
let hiscores=loadHi(), lbOnline=false, lbPending=null, justAdded=null;
function loadHi(){try{const s=JSON.parse(localStorage.getItem('freddyflames.board'));if(Array.isArray(s))return cleanBoard(s);}catch(e){}return [];}
function saveHi(){try{localStorage.setItem('freddyflames.board',JSON.stringify(hiscores));}catch(e){}}
function cleanBoard(a){
  return (Array.isArray(a)?a:[]).filter(r=>Array.isArray(r)&&typeof r[0]==='string'&&Number.isFinite(r[1]))
    .map(r=>{const e=[r[0].slice(0,3).toUpperCase(),Math.floor(r[1])];if(Number.isFinite(r[2]))e.push(Math.floor(r[2]));return e;})
    .sort((x,y)=>y[1]-x[1]||(y[2]||0)-(x[2]||0)).slice(0,LB_SIZE);
}
async function lbRequest(opts){
  if(LB_URL.includes('BIN_ID'))throw new Error('no bin yet');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),6000);
  try{const r=await fetch(LB_URL,{cache:'no-store',...opts,signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return r;}
  finally{clearTimeout(t);}
}
async function refreshBoard(){
  try{hiscores=cleanBoard(await (await lbRequest({})).json());lbOnline=true;saveHi();}catch(e){lbOnline=false;}
}
async function submitScore(n,sc,lv){
  let list=hiscores;
  try{list=cleanBoard(await (await lbRequest({})).json());lbOnline=true;}catch(e){lbOnline=false;}
  hiscores=cleanBoard(list.concat([[n,sc,lv]]));justAdded=[n,sc];saveHi();
  if(!lbOnline)return;
  try{await lbRequest({method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(hiscores)});}catch(e){lbOnline=false;}
}
const qualifies=sc=>sc>0&&(hiscores.length<LB_SIZE||sc>hiscores[hiscores.length-1][1]);

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pal=()=>PAL[((st==='attract'?demoLevel:level)-1)%4];
const cyc=()=>Math.floor(((st==='attract'?demoLevel:level)-1)/4);
const fdim=s=>({w:6+s*3,h:6+s*4});
const tankLvl=()=>Math.ceil(fred.tank/2);

// ---------- input ----------
// RAW is written by keyboard + touch, GP by a gamepad; I = what is held this frame, P = what was just pressed.
const KS=['left','right','up','down','jump','fire','start'];
const RAW={},GP={},I={},prev={},P={};KS.forEach(k=>{RAW[k]=GP[k]=I[k]=prev[k]=P[k]=0;});
let tapStart=false;
const KEYS={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',
  z:'jump',Z:'jump',k:'jump',K:'jump',Shift:'jump',x:'fire',X:'fire',j:'fire',J:'fire',' ':'fire',Control:'fire',Enter:'start','1':'start'};
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ.-!';
let kbUp=false;
const clearRaw=()=>{KS.forEach(k=>RAW[k]=0);kbUp=false;};
function togglePause(){if(st==='play'||st==='bonus'){paused=!paused;clearRaw();}}
addEventListener('keydown',e=>{
  ensureAudio();
  if(st==='initials'&&entry){
    if(/^[a-zA-Z]$/.test(e.key)){if(!e.repeat){entry.c[entry.pos]=LETTERS.indexOf(e.key.toUpperCase());if(entry.pos<2)entry.pos++;sfx.tick();}e.preventDefault();return;}
    if(e.key==='Backspace'){if(entry.pos>0)entry.pos--;sfx.tick();e.preventDefault();return;}
  }
  if(e.key==='m'||e.key==='M'){muted=!muted;return;}
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){if(!e.repeat)togglePause();return;}
  const k=KEYS[e.key]; if(k){RAW[k]=1;if(k==='up')kbUp=true;e.preventDefault();}
});
addEventListener('keyup',e=>{const k=KEYS[e.key]; if(k){RAW[k]=0;if(k==='up')kbUp=false;}});
addEventListener('blur',()=>{clearRaw();if(st==='play'||st==='bonus')paused=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearRaw();if(st==='play'||st==='bonus')paused=true;}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();cv.focus();if(st==='attract'||paused)tapStart=true;});
const buzz=ms=>{if(touch&&navigator.vibrate)try{navigator.vibrate(ms);}catch(_){}};
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();ensureAudio();RAW[k]=1;b.classList.add('on');buzz(10);try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const off=()=>{RAW[k]=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,off));
});
// One-thumb joystick: touch anywhere on it and slide; the strongest direction wins (4-way, like the cabinet).
const dp=document.getElementById('dpad'),knob=dp.querySelector('.knob'),arrs={};
dp.querySelectorAll('[data-dir]').forEach(a=>arrs[a.dataset.dir]=a);
let dpId=null,dpDir=null;
function dpApply(dir){
  if(dir===dpDir)return;dpDir=dir;
  ['left','right','up','down'].forEach(k=>{RAW[k]=k===dir?1:0;arrs[k].classList.toggle('on',k===dir);});
  const o={left:[-22,0],right:[22,0],up:[0,-22],down:[0,22]}[dir]||[0,0];
  knob.style.transform='translate('+o[0]+'px,'+o[1]+'px)';
}
function dpMove(e){
  const r=dp.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  if(Math.hypot(dx,dy)<r.width*.13){dpApply(null);return;}
  const ax=Math.abs(dx),ay=Math.abs(dy);
  const horiz=(dpDir==='left'||dpDir==='right')?ax*1.35>ay:(dpDir==='up'||dpDir==='down')?ax>ay*1.35:ax>ay;
  dpApply(horiz?(dx<0?'left':'right'):(dy<0?'up':'down'));
}
dp.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();dpId=e.pointerId;try{dp.setPointerCapture(dpId);}catch(_){}dpMove(e);});
dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpMove(e);});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dp.addEventListener(t,e=>{if(e.pointerId===dpId){dpId=null;dpApply(null);}}));
document.querySelectorAll('.side,canvas').forEach(el=>{
  el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
// Any USB/Bluetooth gamepad: d-pad or left stick moves, bottom button jumps, other face buttons squirt.
function pollPad(){
  const pads=navigator.getGamepads?navigator.getGamepads():[];let gp=null;
  for(const p of pads)if(p&&p.connected){gp=p;break;}
  if(!gp){KS.forEach(k=>GP[k]=0);return;}
  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  GP.left=b(14)||ax<-.5;GP.right=b(15)||ax>.5;GP.up=b(12)||ay<-.5;GP.down=b(13)||ay>.5;
  GP.jump=b(0);GP.fire=b(1)||b(2)||b(3)||b(5)||b(7);GP.start=b(9);
}
function readInput(){
  pollPad();
  for(const k of KS){I[k]=RAW[k]||GP[k]?1:0;P[k]=I[k]&&!prev[k]?1:0;prev[k]=I[k];}
}

// ---------- sound ----------
let ac=null, muted=false, nbuf=null;
function ensureAudio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(ac.state==='suspended')ac.resume();
}
function tone(f,d,type='square',v=.06,f2=0,delay=0){
  if(!ac||muted)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);

// pick a spot that is NOT right next to Freddy, so nobody can farm the start area

// ---------- update ----------
function updFred(dt){
  const f=fred;f.inv=Math.max(0,f.inv-dt);
  if(f.mode==='floor'){
    let mv=(I.right?1:0)-(I.left?1:0);
    if(mv){f.dir=mv;f.x+=mv*44*dt;f.anim+=dt;}
    f.x=clamp(f.x,LEFT,RIGHT);
    f.jb=Math.max(0,(f.jb||0)-dt);if(P.jump)f.jb=.15;
    if(!f.air&&inHole(f.f,f.x)){f.air=true;f.vy=20;f.f--;}
    if(f.air){

      if(f.y>=FL[f.f]){f.y=FL[f.f];f.air=false;f.vy=0;}
    }else{
      if(P.up&&kbUp&&!LADDERS.some(l=>l.a===f.f&&Math.abs(l.x-f.x)<18))f.jb=.15;
      if(f.jb>0){f.jb=0;f.air=true;f.vy=-130;sfx.jump();}
      else if(I.up||I.down){
        // forgiving ladders: hold up/down near one and Freddy steps onto it
        let L=null,bd=99;
        for(const l of LADDERS)if(I.up?l.a===f.f:l.b===f.f){const d=Math.abs(l.x-f.x);if(d<bd){bd=d;L=l;}}
        if(L&&bd<3){f.mode='climb';f.lad=L;f.x=L.x;}
        else if(L&&bd<18&&!mv){const sg=Math.sign(L.x-f.x);f.x+=sg*Math.min(bd,44*dt);f.dir=sg;f.anim+=dt;}
      }
    }
    f.cd=Math.max(0,(f.cd||0)-dt);
    if(P.fire)squirt(true);else if(I.fire&&f.cd<=0)squirt(false);
  }else{
    const L=f.lad,v=(I.down?1:0)-(I.up?1:0);
    f.y+=v*34*dt;if(v)f.anim+=dt;
    const top=FL[L.b],bot=FL[L.a];
    if(f.y>bot){f.y=bot;f.f=L.a;f.mode='floor';}
    else if(f.y<top){f.y=top;f.f=L.b;f.mode='floor';}
    else if((I.left||I.right)&&(Math.abs(f.y-bot)<3||Math.abs(f.y-top)<3)){

    }
  }
}
function squirt(manual){

function updStreams(dt){

      for(const t of targets){

        s.hit=true;s.max=s.len=Math.max(2,Math.abs(t.x-s.x)-4);targets.splice(targets.indexOf(t),1);
        combo=Math.min(5,combo+1);const pts=lvPts(100*combo);addScore(pts);bonusScore+=pts;sfx.out();
        pops.push({x:t.x,y:FL[t.f]-22,t:.8,s:String(pts),c:'#ffffff'});
        for(let i=0;i<10;i++)parts.push({x:t.x+rnd(-4,4),y:FL[t.f]-4,vx:rnd(-15,15),vy:rnd(-50,-15),l:rnd(.5,1),c:'#c9ced8',z:2,steam:1});
        break;

function updFlames(dt,cap){

      const nx=fl.x+fl.dir*(fl.hold>0?0:p.sp*m*(fl.dash>0?1.7:1))*dt;
      if(fl.cool<=0)for(const L of LADDERS){

    }
  }
}

      if(bonus){for(let k=0;k<8;k++)parts.push({x:pp.x+rnd(-2,2),y:FL[pp.f]-47,vx:rnd(-30,30),vy:rnd(-20,30),l:.5,c:'#7fd0ff',z:1,g:1});noise(.25,1800,.06,1);}
    }

    for(let i=0;i<4;i++)parts.push({x:d.x,y:FL[d.f]-1,vx:rnd(-25,25),vy:rnd(-45,-15),l:.35,c:'#7fd0ff',z:1,g:1});

  puds=puds.filter(p=>{
    if(p.f!==f.f||Math.abs(f.x-p.x)>PUDW[p.s]/2+3)return true;
    if(bonus){

      const pts=lvPts([0,50,100,150][p.s]*combo);addScore(pts);bonusScore+=pts;f.tank=TANKMAX;sfx.fill(p.s);
      pops.push({x:p.x,y:FL[p.f]-20,t:.8,s:String(pts),c:'#7fd0ff'});return false;
    }
    if(f.tank>=TANKMAX)return true;
    const add=[0,4,8,16][p.s];f.tank=Math.min(TANKMAX,f.tank+add);addScore(lvPts(10*p.s));sfx.fill(p.s);
    pops.push({x:p.x,y:FL[p.f]-20,t:.8,s:['','1/4','1/2','FULL'][p.s],c:'#7fd0ff'});
    for(let i=0;i<6;i++)parts.push({x:p.x+rnd(-6,6),y:FL[p.f]-2,vx:rnd(-20,20),vy:rnd(-60,-20),l:.4,c:'#bfe6ff',z:1,g:1});

function hurtCheck(){
  const f=fred;if(f.inv>0)return;
  const fx1=f.x-3,fx2=f.x+3,fy1=f.y-15,fy2=f.y;
  for(const fl of flames){
    const {w,h}=fdim(fl.s);
    const l=fl.x-w/2+2,r=fl.x+w/2-2,t=fl.y-h+3,b=fl.y;
    if(fx2>l&&fx1<r&&fy2>t&&fy1<b){st='dying';stT=2.2;streams=[];sfx.die();return;}
  }
}
function updParts(dt){
  for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g||(!p.steam))p.vy+=(p.steam?-20:200)*dt;if(p.steam)p.vx*=.98;}
  parts=parts.filter(p=>p.l>0);
  for(const p of pops){p.t-=dt;p.y-=14*dt;}
  pops=pops.filter(p=>p.t>0);

function update(dt){
  clock+=dt;
  readInput();
  if(paused){if(P.start||P.fire||P.jump||tapStart)paused=false;tapStart=false;return;}
  const anyStart=P.start||P.fire||P.jump||tapStart;tapStart=false;
  switch(st){
    case 'attract':
      stT-=dt;{const dl=1+Math.floor(clock/9)%5;if(dl!==demoLevel){demoLevel=dl;setHouse(dl);resetPipes(false);drips=[];puds=[];embers=[];}}
      updFlames(dt,7);updEmbers(dt,7);updWater(dt,false,false);
      if(stT<=0){atPage=(atPage+1)%3;stT=atPage===2?6:7;}
      if(anyStart){newGame();}
      break;
    case 'ready': stT-=dt;if(stT<=0)st='play';break;
    case 'play':
      if(P.start){togglePause();break;}
      updFred(dt);updStreams(dt);updFlames(dt,MAXF);updEmbers(dt,MAXF);updWater(dt,false,true);hurtCheck();
      if(st==='play'&&flames.length===0){st='clear';stT=3.4;tankBonus=lvPts(fred.tank*100);addScore(tankBonus);streams=[];sfx.clear();}
      break;
    case 'dying':
      stT-=dt;
      if(stT<=0){
        lives--;
        if(lives<=0){burned=false;st='over';stT=3.5;lbPending=refreshBoard().finally(()=>{lbPending=null;});}
        else{
          const tank=fred.tank;resetFred();fred.tank=Math.max(tank,8);fred.inv=2.5;
          if(burned){burned=false;spawnFlames();puds=[];drips=[];}
          for(const fl of flames)if(fl.f===0&&fl.x<110&&fl.mode==='floor')fl.x=rnd(130,200);
          streams=[];st='ready';stT=1.6;
        }
      }
      break;
    case 'clear':
      stT-=dt;
      if(stT<=0){if(level%3===0)startBonus();else{level++;startLevel();}}
      break;
    case 'bonusReady': stT-=dt;if(stT<=0)st='bonus';break;
    case 'bonus':
      if(P.start){togglePause();break;}
      updFred(dt);updStreams(dt);updBonus(dt);
      if(st==='bonus'){bonusT-=dt;if(bonusT<=0){st='bonusEnd';stT=3;sfx.clear();}}
      break;
    case 'bonusEnd': stT-=dt;if(stT<=0){level++;startLevel();}break;
    case 'over':
      stT-=dt;
      if(stT<=0&&!lbPending){if(qualifies(score)){st='initials';entry={c:[0,0,0],pos:0};}else{justAdded=null;toAttract(2);}}
      break;
    case 'initials':{
      const A=LETTERS,e=entry,dv=(I.up?1:0)-(I.down?1:0);
      const stepL=d=>{e.c[e.pos]=(e.c[e.pos]+d+A.length)%A.length;sfx.tick();};
      if(P.up||P.down){e.rt=.4;stepL(dv);}
      else if(dv){e.rt=(e.rt||0)-dt;if(e.rt<=0){e.rt=.09;stepL(dv);}}
      if((P.left||P.jump)&&e.pos>0){e.pos--;sfx.tick();}
      if(P.fire||P.right||P.start){
        if(e.pos<2){e.pos++;sfx.tick();}
        else{st='saving';sfx.clear();submitScore(e.c.map(i=>A[i]).join(''),score,level).finally(()=>toAttract(2));}
      }
      break;}
  }
  updParts(dt);
}

function drawStreams(){
  for(const s of streams){
    g.globalAlpha=clamp(s.a,0,1);

      const wob=Math.round(Math.sin(d*.7+clock*30)*.6);
      R(s.dir>0?x:x-2,s.y+wob+droop,2,th,'#4fb2ff');
      if(th>1)R(s.dir>0?x:x-2,s.y+wob+droop,2,1,'#e6f7ff');
    }
    g.globalAlpha=1;
  }
}
function drawParts(){
  {const p=pal();for(const e of embers){R(e.x-1,e.y-1,3,3,p.m);R(e.x,e.y,1,1,p.c);}}

function panel(y1,y2){g.globalAlpha=.82;R(16,y1,192,y2-y1,'#07081c');g.globalAlpha=1;R(16,y1,192,1,'#ff6a1a');R(16,y2-1,192,1,'#ff6a1a');}
function drawLogo(y){

    drawFlame({x:142,y:116,s:1,dir:-1,mode:'floor',stun:0,seed:5},p);drawFlame({x:156,y:116,s:1,dir:1,mode:'floor',stun:0,seed:7},p);
    txt('>',124,104,'#9aa1b5');
    txt('FLAMES GROW,',112,122,'#f4ead8','center');txt('THEN SPLIT IN TWO',112,133,'#f4ead8','center');
    [[3,'FULL TANK'],[2,'1/2 TANK'],[1,'1/4 TANK']].forEach(([s,l],i)=>{
      const y=160+i*13,w=PUDW[s];R(44-w/2,y+2,w,2,'#2a6fd0');R(46-w/2,y+1,w-4,1,'#3a8fe8');txt(l,70,y-2,'#7fd0ff');

    txt('PUDDLES REFILL YOUR TANK',112,202,'#f4ead8','center');
    txt('MORE WATER, LONGER SQUIRT',112,214,'#f4ead8','center');
    txt('SHRINK 50   OUT 200',112,232,'#ffcf4a','center');
    txt(touch?'RED SQUIRT  BLUE JUMP':'SPACE SQUIRT  UP JUMP',112,246,'#9aa1b5','center');
  }else{
    txt('GLOBAL TOP 10',112,32,'#ffcf4a','center');
    const ord=['1ST','2ND','3RD','4TH','5TH','6TH','7TH','8TH','9TH','10TH'];
    for(let i=0;i<LB_SIZE;i++){
      const r=hiscores[i],y=50+i*15;
      const mine=r&&justAdded&&r[0]===justAdded[0]&&r[1]===justAdded[1];
      const c=mine?'#6fdc3e':i===0?'#ff4a3a':'#f4ead8';
      txt(ord[i],12,y,c);txt(r?r[0]:'---',56,y,c);txt(r?pad(r[1],6):'------',96,y,c);txt(r&&r[2]?'LV'+pad(r[2],2):'----',172,y,c);
    }
    if(!lbOnline)txt('OFFLINE - LAST KNOWN',112,204,'#5a5f70','center');
    if(blink)txt(touch?'TAP HERE TO START':'PRESS SPACE TO START',112,220,'#ff4a3a','center');
    txt('RECREATION OF ORIGINAL,',112,238,'#9aa1b5','center');txt('CIRCA 1983',112,249,'#9aa1b5','center');
  }
}
function drawPet(o){
  const x=Math.round(o.x),y=FL[o.f],d=o.dir;
  switch(o.k){
    case 'cat':{const c='#e08a3a',hx=d>0?x+2:x-6;R(x-4,y-5,8,4,c);R(hx,y-8,4,4,c);R(hx,y-9,1,1,c);R(hx+3,y-9,1,1,c);R(hx+(d>0?2:1),y-7,1,1,'#111');R(d>0?x-6:x+4,y-8,2,4,c);R(x-3,y-1,1,1,c);R(x+2,y-1,1,1,c);break;}
    case 'dog':{const c='#a0703a',hx=d>0?x+3:x-8;R(x-5,y-6,10,5,c);R(hx,y-10,5,5,c);R(d>0?hx:hx+4,y-10,1,4,'#6a4422');R(hx+(d>0?3:1),y-8,1,1,'#111');R(d>0?x-7:x+5,y-9,2,3,c);R(x-4,y-1,2,1,c);R(x+2,y-1,2,1,c);break;}
    case 'bunny':{const c='#ecebf2';R(x-3,y-5,6,5,c);R(x-2,y-8,4,3,c);R(x-2,y-12,1,4,c);R(x+1,y-12,1,4,c);R(x-1,y-7,1,1,'#d04a6a');R(d>0?x-4:x+3,y-4,1,2,c);break;}
    case 'bear':{const c='#8a5a3a';R(x-3,y-6,6,6,c);R(x-3,y-11,6,5,c);R(x-4,y-12,2,2,c);R(x+2,y-12,2,2,c);R(x-1,y-8,2,1,'#d8b08a');R(x-2,y-10,1,1,'#111');R(x+1,y-10,1,1,'#111');break;}
    case 'bird':{const c='#c8a050';R(x-5,y-13,10,1,c);for(let b=x-5;b<=x+4;b+=3)R(b,y-13,1,13,c);R(x-5,y-1,10,1,c);R(x-1,y-7,3,3,'#f2d23a');R(x+2,y-6,1,1,'#ff8a1c');R(x-2,y-5,4,1,'#6a4422');break;}
    case 'fish':{g.globalAlpha=.55;R(x-5,y-9,10,9,'#5cc2ff');g.globalAlpha=1;R(x-5,y-9,10,1,'#bfe6ff');R(x-2+Math.round(Math.sin(clock*3+o.seed)*2),y-5,4,2,'#ff8a1c');break;}
  }

}
function drawBonus(p){
  if(bType===0){

  }else if(bType===1){for(const o of pets)drawPet(o);}
  else{
    for(const t of targets){
      if(t.t<1&&Math.floor(clock*10)%2)continue;
      drawFlame({x:t.x,y:FL[t.f],s:2,dir:1,mode:'floor',stun:0,seed:t.seed},p);
      const w=Math.round(14*t.t/t.life);R(t.x-7,FL[t.f]+5,14,1,'#2a1a12');R(t.x-7,FL[t.f]+5,w,1,'#ffcf4a');

function render(){
  drawWorld();drawPuds();
  const p=pal();
  for(const fl of flames)drawFlame(fl,p);
  if(st==='bonus'||st==='bonusReady'||st==='bonusEnd')drawBonus(p);
  if(st!=='attract'&&fred){
    if(st==='dying')drawDeadFred();
    else if(!(fred.inv>0&&Math.floor(clock*12)%2))drawFred(fred.x,fred.y,fred.dir,fred.mode==='climb',fred.anim,false,fred.tank);
  }
  if((st==='play'||st==='ready')&&fred&&fred.mode==='floor'&&!fred.air&&Math.floor(clock*3)%2){
    for(const l of LADDERS){
      if(Math.abs(l.x-fred.x)>18)continue;
      if(l.a===fred.f){const y=FL[fred.f]-26;R(l.x-1,y,3,1,'#ffcf4a');R(l.x-2,y+1,5,1,'#ffcf4a');R(l.x-3,y+2,7,1,'#ffcf4a');}
      if(l.b===fred.f){const y=FL[fred.f]+6;R(l.x-3,y,7,1,'#ffcf4a');R(l.x-2,y+1,5,1,'#ffcf4a');R(l.x-1,y+2,3,1,'#ffcf4a');}
    }

  drawStreams();drawParts();drawHUD();

    else{txt('POINTS X'+lvMult().toFixed(2).replace(/0$/,''),112,164,'#6fdc3e','center');if(HOLES.length)txt('WATCH THE FLOOR!',112,178,'#ff6a1a','center');}
  }
  if(st==='clear'){panel(96,150);txt('FIRE IS OUT!',112,104,'#ffcf4a','center');txt('TANK BONUS',112,120,'#f4ead8','center');txt(String(tankBonus),112,134,'#7fd0ff','center');}

  }
  if(st==='bonusEnd'){panel(96,bPerfect?160:146);txt(BONUS[bType].n+' BONUS',112,104,'#ffcf4a','center');txt(String(bonusScore),112,120,'#7fd0ff','center');if(bPerfect)txt('ALL PETS SAVED!',112,138,'#6fdc3e','center');}

  if(st==='initials'){
    g.globalAlpha=.85;R(0,24,W,238,'#07060e');g.globalAlpha=1;
    txt('GREAT FIREFIGHTING!',112,70,'#ffcf4a','center');txt('ENTER YOUR INITIALS',112,90,'#f4ead8','center');

    for(let i=0;i<3;i++){const x=88+i*20,on=i===entry.pos;txt(A[entry.c[i]],x+4,124,on?'#ff4a3a':'#ffffff','left',16);if(on&&Math.floor(clock*4)%2)R(x+2,144,18,2,'#ff4a3a');}
    txt(pad(score,6),112,160,'#7fd0ff','center');
    if(touch){txt('STICK UP/DOWN: LETTER',112,192,'#9aa1b5','center');txt('RED BUTTON: NEXT',112,204,'#9aa1b5','center');}
    else{txt('TYPE YOUR INITIALS',112,192,'#9aa1b5','center');txt('THEN PRESS ENTER',112,204,'#9aa1b5','center');}
  }
  if(st==='saving'){panel(110,140);txt('SAVING SCORE...',112,121,'#7fd0ff','center');}
  if(paused){panel(108,150);txt('PAUSED',112,116,'#ffcf4a','center');txt(touch?'TAP TO KEEP PLAYING':'PRESS SPACE TO PLAY',112,132,'#9aa1b5','center');}
}

// ---------- loop ----------
toAttract(0);
refreshBoard();
let last=performance.now();
function frame(now){
  const dt=Math.max(0,Math.min(1/30,(now-last)/1000));last=now;

}
(document.fonts&&document.fonts.load?document.fonts.load('8px "Press Start 2P"').catch(()=>{}):Promise.resolve()).then(()=>requestAnimationFrame(frame));
})();
